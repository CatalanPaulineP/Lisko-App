name: flutter_app
description: A Flutter application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  geolocator: ^10.1.0
  flutter_native_contact_picker: ^0.0.8
  vibration: ^3.2.1
  flutter_local_notifications: ^22.3.0
  iconify_flutter: ^0.0.7
  firebase_core: ^4.14.0
  permission_handler: ^11.3.1
  background_sms: ^0.0.4
  flutter_background_service: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/lisko_logo.png
    - assets/images/map_graphic.png
